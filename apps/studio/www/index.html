<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Studio</title>
  <link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/timeline.css"><link rel="stylesheet" href="/workbench.css"><link rel="stylesheet" href="/advanced-inspector.css">
  <script type="module" src="/app.js"></script><script type="module" src="/guide.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>Video Studio</strong></div>
    <button id="new" class="new-project"><span aria-hidden="true">＋</span> 新建工程</button>
    <h2>最近工程</h2><nav id="projects" aria-label="最近工程"></nav>
    <div class="side-bottom">
      <button class="help-entry" data-guide="current"><span class="help-symbol" aria-hidden="true">?</span> 使用帮助</button>
      <button id="legacy">历史素材与成片</button><a href="/blind">看片盲评</a><button id="environment">本机与账号</button>
      <div class="local-status"><i></i> 本地工作台</div>
    </div>
  </aside>
  <main><header class="topbar"><div class="crumb"><span>工作台</span><b aria-hidden="true">/</b><strong id="current-title">新建工程</strong></div><div id="top-actions"></div></header>
    <div id="notice" role="status" hidden></div><div id="content"></div>
  </main>
  <dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dismiss" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
  <dialog id="guide-dialog" aria-labelledby="guide-title">
    <header class="guide-head"><h1 id="guide-title">使用帮助</h1><label class="guide-search"><span aria-hidden="true">⌕</span><input id="guide-search" type="search" placeholder="搜索按钮、输入框或快捷键" aria-label="搜索帮助"></label><button id="guide-close" aria-label="关闭帮助，返回工作台">完成</button></header>
    <div class="guide-layout"><nav id="guide-nav" aria-label="帮助主题"></nav><article id="guide-body" tabindex="-1"></article></div>
  </dialog>
</body>
</html>
