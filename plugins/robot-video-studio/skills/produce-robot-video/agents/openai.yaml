interface:
  display_name: "制作机器人短视频"
  short_description: "从机器人热点与少量真实素材出发，用 ChatCut 完成中文配音、剪辑、字幕和导出"
  default_prompt: "使用 $produce-robot-video 制作一期 90 秒的机器人热点视频，先给我 2–3 个选题。"
dependencies:
  tools:
    - type: "mcp"
      value: "chatcut"
      description: "已安装并通过 OAuth 登录的 ChatCut Hosted MCP"
      transport: "streamable_http"
      url: "https://api.chatcut.io/api/external-mcp/mcp"
policy:
  allow_implicit_invocation: true
